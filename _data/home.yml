details:
  - title: "About"
    type: "section"
  - type: "content"
    text: "잘 부탁드립니다.\n이 계정은 자놀계 겸 일상/사담계로 만든 계정입니다. 사담 비중이 높긴 하지만 애초에 자놀을 목적으로 만들었던 계정인지라 자놀 비중도 어마무시하기 때문에, 오타쿠의 심도 있는 자덕 토크에 면역이 없으시거나, 그런 류에 거부감이 있으신 분들은 지금이라도 블블을 고려해 주세요."
  - type: "content"
    text: "'R18/G18' 등 성인가가 붙어야 마땅한 컨텐츠의 경우 아무리 플텍계라 하더라도 후세터나 민감한 이미지 필터를 이용할 예정입니다. (그마저도 민망해서 잘 안 풀 확률이 높아요.)"
  - title: "이 페이지는 필요할 때 비정기적으로 업데이트됩니다. (마지막 업데이트: 2026-07-30)"
    open: false
    text: "- 26.07.30: [생성형 AI 및 Grok] 항목 추가"
  - title: "Notice"
    type: "section"
  - title: "자관"
    open: true
    text: "▶ 주력캐/주력관계가 있긴 하지만 이 자관 저 자관 자유롭게 이야기합니다. 탐라에 썰을 풀거나 설정을 풀 때, 혹은 해시태그 등을 풀 때에는 해당 주제에 어울리는 캐릭터나 어울리는 자관 위주로만 서술합니다.\n▶ 편하게 설정 풀고 썰 풀다가 자연스레 이어지는 자관을 선호합니다.\n▶ 그 외의 자관 제안에는 제가 다소 보수적인 태도를 보일 수 있습니다...만, 이 계정은 거의 괜찮은 분들밖에 없어서 크게 신경 안 쓰셔도 될 것 같습니다. 자관 원하는 캐릭터나 '이런 거 녹티 님이랑 해보고 싶어요!' 하는 게 있다면 디엠이나 오카방, 디코, 멘션 등등 편한 창구로 찔러주세요. 자놀이 주력인 사람이라 조율만 원활하다면 뭐든 환영입니다."
  - title: "지뢰│기본적으로 완전히 클린한 장르는 없다는 마인드라 누가 뭘 잡든 적당히 흐린눈 가능합니다만, 아래 장르들은 고려가 좀 필요합니다."
    open: false
    text: "▶ [플레이브 / 왁타버스]: 버추얼 아이돌에 면역이 없습니다. 특히 이 두 그룹 관련으로는 탐라에 들어오면 블언블의 가능성이 있습니다. (특히 플레이브는 개인적으로 진짜 힘들어요.)\n그냥 버튜버는 OK. 아이돌만 아니면 괜찮습니다.\n▶ [호요버스, 쿠키런 ip]: 호요버스는 제 장르 표절이슈, 쿠키런은 버닝썬 이슈로 거부감이 좀 있습니다. 어쩌다 들어오는 정도는 괜찮지만 이걸 메인으로 잡는 분이 생긴다면 조용히 보내드립니다.\n▶ 그 외 [귀멸의 칼날, Project Moon의 컨텐츠, 에이스테 등 논란이 너무 명확하고 중대한 장르]: 보통 이런 것들은 제 탐라 분들도 극혐하시기 때문에 걱정은 안 되지만 혹시 몰라 적어둡니다."
  - title: "생성형 AI 및 Grok"
    open: false
    text: "▶ **Ai 자체에 대하여**: 시대의 흐름에 따라 Ai의 발전과 사용은 불가피함을 알고 있으므로 Gemini, 챗GPT, Claude 등의 사용 등이나 그 자체에 관해서는 별 생각 없습니다. \n▶ **생성형 Ai에 대하여**: 다만 생성형 Ai로 생성한 이미지, 음악, 문학 등 저작권과 관련된 논의가 아직 이루어지지 않았거나 관련 규제가 정착되지 않은 분야에 대한 사용은 (저 또한 창작자의 입장인지라) 여전히 아주 부정적으로 보고 있습니다. 미드저니와 같은 전용 Ai뿐만 아니라 GPT, Gemini를 이용한 이미지/음악/글(문학) 생성 또한 마찬가지입니다. 따라서 개인적인 사용까지 무어라 말할 권한은 제게 없지만 탐라에 전시될 경우 블언블할 예정입니다. 무단 학습으로부터 창작자를 보호할 방안이 마련된다면 저도 Ai를 반길 입장입니다만 그 전까지는 보수적인 태도일 것 같습니다.\n▶ **Grok에 대하여**: Grok의 사용 또한 부정적인 입장입니다. 뭘 어떻게 먹고 학습한 Ai인지 그 과정을 모두가 지켜봤으니까요. 따라서 '그록아, ~해줘'등과 같은 유행 탑승은 자주 보일 경우 블언블로 정리할 예정입니다.\n[사건사고1](https://www.yna.co.kr/view/AKR20250710007400075?input=tw) / [사건사고2](https://x.com/hanaori00/status/1923040528918007851?ref_src=twsrc%5Etfw%7Ctwcamp%5Etweetembed%7Ctwterm%5E1923040528918007851%7Ctwgr%5E%7Ctwcon%5Es1_&ref_url=)\n▶ **Ai생성물인지 모르고 리트윗했어요**: 속은 사람이 아니라 속인 사람이 잘못했다고 생각하기 때문에 신경 안 씁니다. 본인 탐라는 편하게 쓰세요. (그리고 저도 종종 Ai 분간 잘 안 됨)"
