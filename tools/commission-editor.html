<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commission Markdown Editor</title>
  <style>
    :root { color-scheme: light; --accent:#6d5c73; --soft:#f3eef4; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f5f3f6; color:#29252d; font-family:Paperlogy,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { margin:0 auto; max-width:1180px; padding:28px 18px 52px; }
    h1 { font-size:1.55rem; margin:0; }
    h2 { font-size:1rem; margin:0 0 14px; }
    .subtitle,.hint,.status { color:#716a75; font-size:.8rem; line-height:1.6; }
    .subtitle { margin:.4rem 0 1.2rem; }
    .layout { display:grid; gap:16px; grid-template-columns:minmax(0,1fr) minmax(320px,.85fr); }
    .panel { background:#fff; border:1px solid #e2dde4; border-radius:12px; box-shadow:0 8px 28px rgba(40,32,43,.05); padding:18px; }
    .grid { display:grid; gap:12px; grid-template-columns:repeat(2,minmax(0,1fr)); }
    label { color:#4d4650; display:block; font-size:.76rem; font-weight:750; margin:0 0 6px; }
    input,select,textarea { background:#fff; border:1px solid #cbc3ce; border-radius:8px; color:#29252d; font:inherit; padding:10px 11px; width:100%; }
    textarea { min-height:110px; resize:vertical; }
    #body { min-height:250px; }
    #output { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.78rem; min-height:430px; white-space:pre; }
    input[type="color"] { min-height:42px; padding:4px; }
    .field { margin-bottom:12px; }
    .check { align-items:center; display:flex; gap:8px; margin-top:10px; }
    .check input { width:auto; }
    .check label { margin:0; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    button { background:#6d5c73; border:0; border-radius:8px; color:#fff; cursor:pointer; font:inherit; font-size:.82rem; font-weight:750; padding:10px 14px; }
    button.secondary { background:#ebe6ed; color:#4d4650; }
    .status { min-height:1.4em; margin:.6rem 0 0; }
    .preview-card { background:#fff; border:1px solid #e2dde4; border-top:4px solid var(--accent); border-radius:10px; padding:16px; }
    .preview-top { align-items:flex-start; display:flex; justify-content:space-between; gap:12px; }
    .preview-label { color:#817887; font-size:.68rem; font-weight:800; letter-spacing:.08em; margin:0 0 4px; text-transform:uppercase; }
    .preview-title { font-size:1.2rem; margin:0; }
    .preview-status { background:var(--soft); border-radius:999px; color:var(--accent); font-size:.7rem; font-weight:800; padding:5px 9px; }
    .preview-summary { color:#665f69; font-size:.82rem; line-height:1.6; }
    .preview-price { color:var(--accent); font-weight:800; }
    .preview-slots { background:var(--soft); border-radius:8px; margin:12px 0; padding:11px; }
    .preview-slots div { display:flex; justify-content:space-between; font-size:.78rem; }
    .preview-track { background:rgba(255,255,255,.85); border-radius:999px; display:block; height:6px; margin-top:8px; overflow:hidden; }
    .preview-track i { background:var(--accent); display:block; height:100%; }
    .preview-body { border-top:1px solid #ece7ed; font-size:.78rem; line-height:1.7; margin-top:12px; padding-top:12px; white-space:pre-wrap; }
    @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
    @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<main>
  <h1>Commission Markdown Editor</h1>
  <p class="subtitle">타입 하나를 작성한 뒤 <code>_commissions/파일명.md</code>로 저장하세요. 같은 방식으로 타입을 여러 개 추가할 수 있습니다.</p>

  <div class="layout">
    <section class="panel">
      <h2>Commission type</h2>
      <div class="grid">
        <div class="field"><label for="title">타입명</label><input id="title" value="Commission"></div>
        <div class="field"><label for="slug">파일명</label><input id="slug" value="commission" placeholder="bust-up"></div>
        <div class="field"><label for="category">상단 분류</label><input id="category" value="Default type"></div>
        <div class="field"><label for="order">정렬 순서</label><input id="order" type="number" min="0" value="1"></div>
        <div class="field"><label for="status">신청 상태</label><select id="status"><option value="open">Open</option><option value="waiting">Waiting</option><option value="closed">Closed</option><option value="preparing" selected>Preparing</option></select></div>
        <div class="field"><label for="price">가격 안내</label><input id="price" value="Details coming soon"></div>
        <div class="field"><label for="slotsTotal">전체 슬롯</label><input id="slotsTotal" type="number" min="0" value="0"></div>
        <div class="field"><label for="slotsRemaining">남은 슬롯</label><input id="slotsRemaining" type="number" min="0" value="0"></div>
        <div class="field"><label for="accent">강조색</label><input id="accent" type="color" value="#6d5c73"></div>
        <div class="field"><label for="soft">배경색</label><input id="soft" type="color" value="#f3eef4"></div>
      </div>
      <div class="field"><label for="summary">한 줄 소개</label><input id="summary" value="신청 안내를 준비하고 있습니다."></div>
      <div class="grid">
        <div class="field"><label for="noticeTitle">공지 제목</label><input id="noticeTitle" value="Notice"></div>
        <div class="field"><label for="updatedAt">업데이트 날짜</label><input id="updatedAt" type="date"></div>
      </div>
      <div class="check"><input id="noticeOpen" type="checkbox" checked><label for="noticeOpen">페이지에서 공지를 펼쳐서 표시</label></div>
      <div class="field" style="margin-top:12px"><label for="body">공지 본문 (Markdown)</label><textarea id="body">커미션 타입별 공지와 신청 조건을 이곳에 작성합니다.

- 작업 범위
- 진행 기간
- 신청 전 확인사항</textarea></div>
      <div class="actions">
        <button id="build" type="button">Markdown 만들기</button>
        <button id="copy" class="secondary" type="button">복사</button>
        <button id="download" class="secondary" type="button">.md 다운로드</button>
      </div>
      <p class="status" id="statusMessage" role="status"></p>
    </section>

    <aside>
      <section class="panel" style="margin-bottom:16px">
        <h2>Preview</h2>
        <article class="preview-card" id="previewCard">
          <div class="preview-top"><div><p class="preview-label" id="previewCategory"></p><h3 class="preview-title" id="previewTitle"></h3></div><span class="preview-status" id="previewStatus"></span></div>
          <p class="preview-summary" id="previewSummary"></p>
          <p class="preview-price" id="previewPrice"></p>
          <div class="preview-slots"><div><span>Remaining slots</span><strong id="previewSlots"></strong></div><span class="preview-track" id="previewTrack"><i></i></span></div>
          <div class="preview-body" id="previewBody"></div>
        </article>
      </section>
      <section class="panel">
        <h2>Output</h2>
        <textarea id="output" spellcheck="false" aria-label="Generated Markdown"></textarea>
      </section>
    </aside>
  </div>
</main>
<script>
(function () {
  var ids = ['title','slug','category','order','status','price','slotsTotal','slotsRemaining','accent','soft','summary','noticeTitle','updatedAt','noticeOpen','body'];
  var fields = {};
  ids.forEach(function (id) { fields[id] = document.getElementById(id); });
  var output = document.getElementById('output');
  var message = document.getElementById('statusMessage');
  var storageKey = 'noctea-commission-editor';

  function yaml(value) {
    return '"' + String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, '\\n') + '"';
  }
  function safeSlug(value) {
    return String(value || 'commission').trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9가-힣_-]/g, '').replace(/-+/g, '-') || 'commission';
  }
  function numbers() {
    var total = Math.max(0, parseInt(fields.slotsTotal.value, 10) || 0);
    var remaining = Math.max(0, parseInt(fields.slotsRemaining.value, 10) || 0);
    if (total > 0) remaining = Math.min(remaining, total);
    return { total: total, remaining: remaining };
  }
  function buildMarkdown() {
    var slot = numbers();
    fields.slug.value = safeSlug(fields.slug.value);
    var lines = [
      '---',
      'title: ' + yaml(fields.title.value.trim()),
      'category: ' + yaml(fields.category.value.trim()),
      'order: ' + (parseInt(fields.order.value, 10) || 0),
      'status: ' + yaml(fields.status.value),
      'slots_total: ' + slot.total,
      'slots_remaining: ' + slot.remaining,
      'price: ' + yaml(fields.price.value.trim()),
      'summary: ' + yaml(fields.summary.value.trim()),
      'accent: ' + yaml(fields.accent.value),
      'soft: ' + yaml(fields.soft.value),
      'notice_title: ' + yaml(fields.noticeTitle.value.trim() || 'Notice'),
      'notice_open: ' + (fields.noticeOpen.checked ? 'true' : 'false'),
      'updated_at: ' + yaml(fields.updatedAt.value),
      '---',
      '',
      fields.body.value.trim(),
      ''
    ];
    output.value = lines.join('\n');
    save();
    renderPreview();
    return output.value;
  }
  function renderPreview() {
    var slot = numbers();
    var labels = { open:'Open', waiting:'Waiting', closed:'Closed', preparing:'Preparing' };
    document.getElementById('previewCategory').textContent = fields.category.value || 'Commission type';
    document.getElementById('previewTitle').textContent = fields.title.value || 'Untitled';
    document.getElementById('previewStatus').textContent = labels[fields.status.value] || 'Preparing';
    document.getElementById('previewSummary').textContent = fields.summary.value;
    document.getElementById('previewPrice').textContent = fields.price.value;
    document.getElementById('previewSlots').textContent = slot.total > 0 ? slot.remaining + ' / ' + slot.total : 'By inquiry';
    document.getElementById('previewTrack').hidden = slot.total === 0;
    document.querySelector('#previewTrack i').style.width = (slot.total ? ((slot.total - slot.remaining) / slot.total * 100) : 0) + '%';
    document.getElementById('previewBody').textContent = fields.body.value;
    document.getElementById('previewCard').style.setProperty('--accent', fields.accent.value);
    document.getElementById('previewCard').style.setProperty('--soft', fields.soft.value);
  }
  function save() {
    var state = {};
    ids.forEach(function (id) { state[id] = fields[id].type === 'checkbox' ? fields[id].checked : fields[id].value; });
    try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (error) {}
  }
  function load() {
    try {
      var state = JSON.parse(localStorage.getItem(storageKey) || '{}');
      ids.forEach(function (id) {
        if (!Object.prototype.hasOwnProperty.call(state, id)) return;
        if (fields[id].type === 'checkbox') fields[id].checked = !!state[id];
        else fields[id].value = state[id];
      });
    } catch (error) {}
    if (!fields.updatedAt.value) fields.updatedAt.value = new Date().toISOString().slice(0, 10);
  }
  document.getElementById('build').addEventListener('click', function () { buildMarkdown(); message.textContent = 'Markdown을 만들었습니다.'; });
  document.getElementById('copy').addEventListener('click', async function () {
    var text = buildMarkdown();
    try { await navigator.clipboard.writeText(text); message.textContent = 'Markdown을 복사했습니다.'; }
    catch (error) { output.focus(); output.select(); document.execCommand('copy'); message.textContent = 'Markdown을 복사했습니다.'; }
  });
  document.getElementById('download').addEventListener('click', function () {
    var blob = new Blob([buildMarkdown()], { type:'text/markdown;charset=utf-8' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = safeSlug(fields.slug.value) + '.md';
    link.click();
    URL.revokeObjectURL(link.href);
    message.textContent = link.download + ' 파일을 만들었습니다.';
  });
  ids.forEach(function (id) { fields[id].addEventListener('input', function () { save(); renderPreview(); }); });
  load();
  buildMarkdown();
})();
</script>
</body>
</html>
