<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noctea Home Editor</title>
  <style>
    :root{--ink:#253129;--muted:#738078;--line:#d7ded9;--paper:#eef2ef;--accent:#174f35;--soft:#e7efe9;--gradient:#575757;--kicker:#fff;--title:#fff;--subtitle:#fff;--archive:#fff}*{box-sizing:border-box}body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}main{margin:0 auto;max-width:1280px;padding:24px 18px 60px}h1{font-size:1.4rem;margin:0 0 14px}h2{font-size:.78rem;margin:0 0 10px}.guide,.panel,.preview{background:#fff;border:1px solid var(--line);border-radius:8px}.guide{margin-bottom:14px;padding:0 13px}.guide summary{cursor:pointer;font-size:.72rem;font-weight:750;padding:11px 0}.guide ol{color:var(--muted);font-size:.68rem;line-height:1.8}.layout{display:grid;gap:16px;grid-template-columns:minmax(410px,.9fr) minmax(480px,1.1fr)}.panel,.preview{padding:16px}.panel+.panel{margin-top:14px}.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}label{color:#626e66;display:block;font-size:.67rem;font-weight:750}input,textarea,select{border:1px solid #cfd8d2;border-radius:5px;font:inherit;font-size:.75rem;margin-top:5px;padding:8px 9px;width:100%}textarea{min-height:88px;resize:vertical}.check{align-items:center;display:flex;gap:.45rem;margin-top:1.3rem}.check input{margin:0;width:auto}.colors{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}input[type=color]{height:38px;padding:3px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}button{background:var(--accent);border:1px solid var(--accent);border-radius:5px;color:#fff;cursor:pointer;font-size:.68rem;font-weight:750;padding:8px 11px}button.secondary{background:#fff;border-color:#bfcac2;color:#536158}button.danger{background:#8b4141;border-color:#8b4141}.status,.small{color:var(--muted);font-size:.64rem}.output{font-family:Consolas,monospace;min-height:240px;margin-top:12px;white-space:pre}.preview-wrap{position:sticky;top:12px}.preview h2{font-size:.66rem;letter-spacing:.08em;margin:0 0 8px}.hero{aspect-ratio:3/1;background:#222;overflow:hidden;position:relative}.hero>img{height:100%;margin:0;object-fit:cover;position:absolute;width:100%;z-index:0}.shade{background:linear-gradient(90deg,color-mix(in srgb,var(--gradient) 23%,transparent),transparent 78%);inset:0;position:absolute;z-index:2}.shade.off{display:none}.copy{bottom:0;left:0;max-width:70%;padding:clamp(10px,3vw,28px);position:absolute;transform:scale(var(--copy-scale,1));transform-origin:left bottom;z-index:4}.copy small{color:var(--kicker);font-size:.46rem;font-weight:800}.copy h3{color:var(--title);font-size:clamp(1.3rem,5vw,3.2rem);line-height:1;margin:.15rem 0}.copy p{font-size:.55rem;margin:.1rem 0}.subtitle{color:var(--subtitle)}.archive{color:var(--archive)}.hero.text-top-left .copy{bottom:auto;top:0;transform-origin:left top}.hero.text-top-right .copy{bottom:auto;left:auto;right:0;text-align:right;top:0;transform-origin:right top}.hero.text-bottom-right .copy{left:auto;right:0;text-align:right;transform-origin:right bottom}.details{background:#fbfbfb;border:1px solid #e1e7e3;border-radius:6px;margin-top:14px;padding:.8rem}.details-title,.section-title{background:var(--accent);color:#fff;display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.08em;margin:.35rem 0 .45rem;padding:.35rem .6rem;text-transform:uppercase}.section-title:first-child{margin-top:0}.detail-toggle{background:color-mix(in srgb,var(--soft) 35%,#fff);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);border-radius:6px;margin:.45rem 0;overflow:hidden}.detail-toggle summary{cursor:pointer;font-size:.74rem;font-weight:800;list-style:none;padding:.55rem .7rem}.detail-toggle summary::-webkit-details-marker{display:none}.detail-toggle summary:before{color:var(--accent);content:"+";display:inline-block;font-weight:900;margin-right:.4rem}.detail-toggle[open] summary:before{content:"-"}.detail-body{border-top:1px solid color-mix(in srgb,var(--accent) 14%,transparent);display:grid;gap:.7rem;padding:.72rem}.detail-text{font-size:.72rem;line-height:1.75;white-space:pre-wrap}.detail-images{display:grid;gap:.45rem;grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}.detail-images img{background:#edf1ee;border-radius:6px;display:block;height:100%;max-height:210px;object-fit:cover;width:100%}.item-list{display:grid;gap:8px;margin-top:10px}.item{background:#fbfbfb;border:1px solid #e1e7e3;border-radius:6px;padding:8px}.item-head{align-items:center;display:flex;gap:8px;justify-content:space-between}.item-title{font-size:.72rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini-actions{display:flex;flex-wrap:wrap;gap:4px}.mini-actions button{font-size:.6rem;padding:5px 7px}@media(max-width:920px){.layout{grid-template-columns:1fr}.preview-wrap{position:static}}@media(max-width:560px){.grid,.colors{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}.item-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <h1>Noctea Home Editor</h1>
  <details class="guide"><summary>이용방법</summary><ol><li>헤더 이미지, 글자 위치, 색상을 조절합니다.</li><li>Details에서 section title과 toggle을 원하는 순서로 추가합니다.</li><li>완성된 <code>home.yml</code>을 내려받아 <code>_data/home.yml</code>과 교체합니다.</li></ol></details>
  <div class="layout">
    <div>
      <section class="panel">
        <h2>Hero</h2>
        <div class="grid">
          <label class="wide">Hero image path<input id="heroImage"></label>
          <label>Horizontal position<input id="cropX" type="range" min="0" max="100" step=".5"></label>
          <label>Vertical position<input id="cropY" type="range" min="0" max="100" step=".5"></label>
          <label>Crop zoom<input id="cropZoom" type="range" min="1" max="4" step=".05"></label>
          <label>Text position<select id="textPosition"><option value="top-left">왼쪽 상단</option><option value="top-right">오른쪽 상단</option><option value="bottom-left">왼쪽 하단</option><option value="bottom-right">오른쪽 하단</option></select></label>
          <label class="check">Use gradient<input id="heroGradient" type="checkbox"></label>
          <label>Gradient opacity<input id="gradientOpacity" type="range" min="0" max="100" step="1"></label>
          <label>Gradient color<input id="heroGradientColor" type="color"></label>
          <label>Copy scale<input id="copyScale" type="range" min="70" max="120" step="1"></label>
          <label>Kicker<input id="kicker"></label>
          <label class="wide">Title<input id="title"></label>
          <label class="wide">Subtitle<input id="subtitle"></label>
          <label class="wide">Archive label<input id="archiveSince"></label>
          <div class="wide colors"><label>Kicker<input id="kickerColor" type="color"></label><label>Title<input id="titleColor" type="color"></label><label>Subtitle<input id="subtitleColor" type="color"></label><label>Archive<input id="archiveColor" type="color"></label></div>
          <div class="wide colors"><label>Accent<input id="accent" type="color"></label><label>Soft<input id="soft" type="color"></label><label>Ink<input id="ink" type="color"></label></div>
        </div>
      </section>

      <section class="panel">
        <h2>Details</h2>
        <div class="grid">
          <label>Section title<input id="detailSectionTitle" placeholder="DETAILS, NOTICE, GALLERY..."></label>
          <label>Toggle title<input id="detailTitle" placeholder="Memo, Character notes..."></label>
          <label>Default state<select id="detailOpen"><option value="false">Closed</option><option value="true">Open</option></select></label>
          <label class="wide">Text<textarea id="detailText"></textarea></label>
          <label class="wide">Images<textarea id="detailImages" placeholder="One image path per line"></textarea></label>
        </div>
        <div class="actions"><button id="addSection" class="secondary" type="button">Add section title</button><button id="addDetail" type="button">Add detail toggle</button><button id="cancelEdit" class="secondary" type="button">Cancel edit</button></div>
        <div class="item-list" id="itemList"></div>
      </section>

      <section class="panel">
        <h2>Output</h2>
        <div class="actions"><button id="download">Download home.yml</button><button id="copy" class="secondary">Copy YAML</button><button id="reset" class="secondary">Reset all</button></div>
        <div class="status" id="status"></div>
        <textarea class="output" id="output" readonly></textarea>
      </section>
    </div>
    <aside class="preview-wrap"><section class="preview"><h2>FINAL PREVIEW - 3:1 HEADER</h2><div class="hero" id="hero"><img id="previewImage" alt=""><span class="shade" id="shade"></span><div class="copy" id="heroCopy"><small id="previewKicker"></small><h3 id="previewTitle"></h3><p class="subtitle" id="previewSubtitle"></p><p class="archive" id="previewSince"></p></div></div><div class="details" id="previewDetails"></div></section></aside>
  </div>
</main>
<script>
(function(){
  'use strict';
  var KEY='noctea-home-editor-v2';
  var D={heroImage:'/noctea-characters/assets/gallery/Noctea/03.png',cropX:52.5,cropY:5.5,cropZoom:1,heroGradient:true,heroGradientColor:'#575757',gradientOpacity:23,textPosition:'top-left',copyScale:95,kickerColor:'#ffffff',titleColor:'#ffffff',subtitleColor:'#ffffff',archiveColor:'#ffffff',kicker:'PRIVATE ARCHIVE',title:'Noctea',subtitle:'Janol sheets',archiveSince:'ARCHIVE SINCE 2026',accent:'#43583c',soft:'#ddd8c0',ink:'#253129'};
  var details=[{type:'section',title:'DETAILS'},{title:'Memo',open:true,text:'이곳에 홈페이지 소개와 메모를 적어주세요.',images:[]}];
  var editing=null;
  var ids=Object.keys(D),$=function(id){return document.getElementById(id)};
  function get(id){return id==='heroGradient'?$(id).checked:$(id).value}
  function set(id,v){if(id==='heroGradient')$(id).checked=v===true||v==='true';else $(id).value=v}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
  function yaml(v){return JSON.stringify(String(v==null?'':v))}
  function imagePath(value){var p=String(value||'').trim().replace(/[\\]+/g,'/');if(!p)return'';if(/^(https?:|data:|blob:)/i.test(p))return p;var lower=p.toLowerCase(),i=lower.indexOf('/assets/');if(i>=0)p=p.slice(i);else if(lower.indexOf('assets/')===0)p='/'+p;else return p;if(p.indexOf('/noctea-characters/')===0)return p;return'/noctea-characters'+p}
  function previewSrc(src){src=imagePath(src);if(!src)return'';if(/^(https?:|data:|blob:)/i.test(src))return src;if(location.protocol==='file:'&&src.indexOf('/noctea-characters/')===0)return'../'+src.replace(/^\/noctea-characters\//,'');return src}
  function lineImages(){return $('detailImages').value.split(/\r?\n/).map(function(line){return imagePath(line.trim())}).filter(Boolean)}
  function clearDetailForm(){['detailSectionTitle','detailTitle','detailText','detailImages'].forEach(function(id){$(id).value=''});$('detailOpen').value='false';editing=null;$('addSection').textContent='Add section title';$('addDetail').textContent='Add detail toggle'}
  function addSection(){var item={type:'section',title:get('detailSectionTitle').trim()||'SECTION'};if(editing!=null){details[editing]=item}else{details.push(item)}clearDetailForm();render('Updated details.')}
  function addDetail(){var item={title:get('detailTitle').trim()||'Detail',open:get('detailOpen')==='true',text:get('detailText'),images:lineImages()};if(editing!=null){details[editing]=item}else{details.push(item)}clearDetailForm();render('Updated details.')}
  function editItem(index){var item=details[index];if(!item)return;editing=index;if(item.type==='section'){set('detailSectionTitle',item.title);set('detailTitle','');set('detailText','');set('detailImages','');$('detailOpen').value='false';$('addSection').textContent='Update section title'}else{set('detailSectionTitle','');set('detailTitle',item.title);set('detailText',item.text||'');set('detailImages',(item.images||[]).join('\n'));$('detailOpen').value=String(!!item.open);$('addDetail').textContent='Update detail toggle'}}
  function removeItem(index){details.splice(index,1);clearDetailForm();render('Removed item.')}
  function moveItem(index,dir){var to=index+dir;if(to<0||to>=details.length)return;var item=details.splice(index,1)[0];details.splice(to,0,item);render('Moved item.')}
  function renderItems(){var html=details.map(function(item,index){var label=item.type==='section'?'Section title':'Detail toggle';var body=item.title+(item.images&&item.images.length?' | images: '+item.images.length:'');return'<div class="item"><div class="item-head"><div><div class="item-title">'+esc(label)+'</div><div class="small">'+esc(body)+'</div></div><div class="mini-actions"><button type="button" data-move="-1" data-index="'+index+'">Up</button><button type="button" data-move="1" data-index="'+index+'">Down</button><button type="button" data-edit="'+index+'">Edit</button><button type="button" class="danger" data-remove="'+index+'">Remove</button></div></div></div>'}).join('');$('itemList').innerHTML=html||'<p class="small">No detail items yet.</p>'}
  function renderDetailsPreview(){$('previewDetails').innerHTML=details.map(function(item){if(item.type==='section')return'<div class="section-title">'+esc(item.title)+'</div>';var images=(item.images||[]).map(function(src){return'<img src="'+esc(previewSrc(src))+'" alt="">'}).join('');return'<details class="detail-toggle" '+(item.open?'open':'')+'><summary>'+esc(item.title)+'</summary><div class="detail-body">'+(item.text?'<div class="detail-text">'+esc(item.text)+'</div>':'')+(images?'<div class="detail-images">'+images+'</div>':'')+'</div></details>'}).join('')}
  function build(){var path=imagePath(get('heroImage'));var lines=['hero_image: '+yaml(path),'hero_position: '+yaml(get('cropX')+'% '+get('cropY')+'%'),'hero_crop_x: '+Number(get('cropX')),'hero_crop_y: '+Number(get('cropY')),'hero_crop_zoom: '+Number(get('cropZoom')),'hero_gradient: '+(get('heroGradient')?'true':'false'),'hero_gradient_color: '+yaml(get('heroGradientColor')),'hero_gradient_opacity: '+Number(get('gradientOpacity')),'hero_copy_scale: '+Number(get('copyScale')),'hero_text_position: '+yaml(get('textPosition')),'kicker_color: '+yaml(get('kickerColor')),'title_color: '+yaml(get('titleColor')),'subtitle_color: '+yaml(get('subtitleColor')),'archive_color: '+yaml(get('archiveColor')),'kicker: '+yaml(get('kicker')),'title: '+yaml(get('title')),'subtitle: '+yaml(get('subtitle')),'archive_since: '+yaml(get('archiveSince')),'accent: '+yaml(get('accent')),'soft: '+yaml(get('soft')),'ink: '+yaml(get('ink')),'details:'];details.forEach(function(item){lines.push('  - title: '+yaml(item.title));if(item.type==='section'){lines.push('    type: "section"');return}lines.push('    open: '+(item.open?'true':'false'));lines.push('    text: '+yaml(item.text||''));if(item.images&&item.images.length){lines.push('    images:');item.images.forEach(function(image){lines.push('      - '+yaml(image))})}});lines.push('');$('output').value=lines.join('\n');return $('output').value}
  function render(message){var path=previewSrc(get('heroImage'));$('previewImage').src=path;$('previewImage').style.objectPosition=get('cropX')+'% '+get('cropY')+'%';$('previewImage').style.transform='scale('+Math.max(1,Number(get('cropZoom'))||1)+')';$('shade').classList.toggle('off',!get('heroGradient'));$('shade').style.background='linear-gradient('+(get('textPosition').indexOf('right')>=0?'270deg':'90deg')+',color-mix(in srgb,'+get('heroGradientColor')+' '+get('gradientOpacity')+'%,transparent),transparent 78%)';$('hero').className='hero text-'+get('textPosition');$('heroCopy').style.setProperty('--copy-scale',Number(get('copyScale'))/100);[['--kicker',get('kickerColor')],['--title',get('titleColor')],['--subtitle',get('subtitleColor')],['--archive',get('archiveColor')],['--accent',get('accent')],['--soft',get('soft')],['--ink',get('ink')]].forEach(function(x){document.documentElement.style.setProperty(x[0],x[1])});$('previewKicker').textContent=get('kicker');$('previewTitle').textContent=get('title');$('previewSubtitle').textContent=get('subtitle');$('previewSince').textContent=get('archiveSince');renderItems();renderDetailsPreview();build();var model={details:details};ids.forEach(function(id){model[id]=get(id)});localStorage.setItem(KEY,JSON.stringify(model));if(message)$('status').textContent=message}
  var saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  ids.forEach(function(id){set(id,saved&&saved[id]!=null?saved[id]:D[id]);$(id).addEventListener('input',function(){render()})});
  if(saved&&Array.isArray(saved.details))details=saved.details;
  $('addSection').onclick=addSection;$('addDetail').onclick=addDetail;$('cancelEdit').onclick=function(){clearDetailForm();render('Edit cancelled.')};
  $('itemList').onclick=function(event){var target=event.target;if(target.dataset.edit!=null)editItem(Number(target.dataset.edit));if(target.dataset.remove!=null)removeItem(Number(target.dataset.remove));if(target.dataset.move!=null)moveItem(Number(target.dataset.index),Number(target.dataset.move))};
  $('copy').onclick=async function(){try{await navigator.clipboard.writeText(build());$('status').textContent='YAML copied.'}catch(e){$('output').focus();$('output').select();document.execCommand('copy');$('status').textContent='YAML selected/copied.'}};
  $('download').onclick=function(){var url=URL.createObjectURL(new Blob([build()],{type:'text/yaml'})),a=document.createElement('a');a.href=url;a.download='home.yml';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)};
  $('reset').onclick=function(){if(confirm('모든 설정을 초기화할까요?')){localStorage.removeItem(KEY);ids.forEach(function(id){set(id,D[id])});details=[{type:'section',title:'DETAILS'},{title:'Memo',open:true,text:'이곳에 홈페이지 소개와 메모를 적어주세요.',images:[]}];clearDetailForm();render('Reset complete.')}};
  render();
})();
</script>
</body>
</html>
